
name: CI-iOS

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 15 # Increased slightly as TSan and Clean builds take time

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      # Using a glob pattern or the specific path to ensure we use the latest available
      run: sudo xcode-select -switch /Applications/Xcode_26.1.1.app

    - name: Xcode version
      run: xcodebuild -version

    - name: Build and Test
      # Changed destination to be more generic to avoid 'Device not found' errors
      # Added CODE_SIGNING_ALLOWED=NO for better compatibility
      run: |
        xcodebuild clean build test \
          -workspace EssentialApp/EssentialApp.xcworkspace \
          -scheme "CI_iOS" \
          -sdk iphonesimulator \
          -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
          -enableThreadSanitizer YES \
          ONLY_ACTIVE_ARCH=YES \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
